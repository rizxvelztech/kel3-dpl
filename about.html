<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kelompok 3 - About</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://unpkg.com/aos@2.3.1/dist/aos.css">
</head>
<body>

    <nav>
        <div class="brand">
            <h2>KELOMPOK 3</h2>
            <span>X PPLG 1</span>
        </div>
        <a href="index.html" onclick="klik(event)">Home</a>
    </nav>

    <div class="container">

        <h1 data-aos="fade-down">Tentang <span>Kami</span></h1>

        <div class="about-box" data-aos="fade-up">
            <p>
                Kami adalah siswa kelas X PPLG 1 SMK Negeri 1 Karawang yang sedang
                belajar membuat website bersama. Website ini dibuat sebagai tugas
                kelompok untuk melatih kemampuan HTML, CSS, dan JavaScript.
            </p>
        </div>

        <h1 data-aos="fade-down" style="margin-top: 60px;">
            Foto <span>Kelas</span>
        </h1>

        <div class="slideshow" data-aos="zoom-in">
            <img src="kelas1.jpg" class="slide active">
            <img src="kelas2.jpg" class="slide">
            <img src="kelas3.jpg" class="slide">
            <img src="kelas4.jpg" class="slide">
            <img src="kelas5.jpg" class="slide">
        </div>
    </div>

    <audio id="klik" src="click.wav" preload="auto"></audio>

    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>

    <script>
        AOS.init({ duration: 800, once: false });

        function klik(e) {
            e.preventDefault();
            const tujuan = e.currentTarget.href;
            const suara = document.getElementById('klik');

            suara.currentTime = 0;
            suara.play();

            setTimeout(() => {
                window.location.href = tujuan;
            }, 200);
        }

        // SLIDESHOW OTOMATIS
        const slides = document.querySelectorAll('.slide');
        let index = 0;

        setInterval(() => {
            slides[index].classList.remove('active');
            index = (index + 1) % slides.length;
            slides[index].classList.add('active');
        }, 3000); // ganti tiap 3 detik
    </script>

</body>
</html>
