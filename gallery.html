<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kelompok 3 - Gallery</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://unpkg.com/aos@2.3.1/dist/aos.css">
</head>
<body>

    <!-- Navbar -->
    <nav>
        <div class="brand">
            <img src="logo_neskar.jpg" alt="Logo">
            <h2>|| KELOMPOK 3</h2>
        </div>

        <div class="hamburger" onclick="toggleMenu()">☰</div>

        <ul class="menu" id="menu">
            <li><a href="index.html" onclick="klik(event)">Home</a></li>
            <li><a href="gallery.html">Gallery</a></li>
            <li><a href="about.html" onclick="klik(event)">About</a></li>
        </ul>
    </nav>

    <!-- Gallery Anggota -->
    <div class="container">
        <h1 data-aos="fade-down">Gallery <span>Anggota</span></h1>

        <div class="gallery">

            <div class="card" data-aos="zoom-in" data-aos-delay="600">
                <img src="alifia.jpg" onclick="bukaFoto(this)">
                <h3>Alifia</h3>
            </div>
            
            <div class="card" data-aos="zoom-in" data-aos-delay="500">
                <img src="aulia.jpg" onclick="bukaFoto(this)">
                <h3>Aulia</h3>
            </div>

            <div class="card" data-aos="zoom-in" data-aos-delay="800">
                <img src="diva.jpg" onclick="bukaFoto(this)">
                <h3>Diva</h3>                
            </div>
            
            <div class="card" data-aos="zoom-in" data-aos-delay="700">
                <img src="najwa.jpg" onclick="bukaFoto(this)">
                <h3>Najwa</h3>
            </div>
            
            <div class="card" data-aos="zoom-in" data-aos-delay="100">
                <img src="adnan.jpg" onclick="bukaFoto(this)">
                <h3>Adnan</h3>
            </div>

            <div class="card" data-aos="zoom-in">
                <img src="afrizal.jpg" onclick="bukaFoto(this)">
                <h3>Afrizal</h3>
            </div>
            
            <div class="card" data-aos="zoom-in" data-aos-delay="200">
                <img src="avino.jpg" onclick="bukaFoto(this)">
                <h3>Avino</h3>
            </div>

            <div class="card" data-aos="zoom-in" data-aos-delay="300">
                <img src="dzaky.jpg" onclick="bukaFoto(this)">
                <h3>Dzaky</h3>
            </div>

            <div class="card" data-aos="zoom-in" data-aos-delay="400">
                <img src="faris.jpg" onclick="bukaFoto(this)">
                <h3>Faris</h3>
            </div>                                            
                                    
        </div>
    </div>

    <!-- Modal Foto Besar -->
    <div class="modal" id="modal" onclick="tutupFoto()">
        <img id="fotoBesar" src="">
    </div>

    <!-- Audio Klik -->
    <audio id="klik" src="click.wav" preload="auto"></audio>

    <!-- Library AOS -->
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>

    <script>
        AOS.init({ duration: 400, once: false });

        function klik(e) {
            e.preventDefault();
            const tujuan = e.currentTarget.href;
            const suara = document.getElementById('klik');

            suara.currentTime = 0;
            suara.play();

            setTimeout(() => {
                window.location.href = tujuan;
            }, 200);
        }

        function bukaFoto(el) {
            document.getElementById('fotoBesar').src = el.src;
            document.getElementById('modal').style.display = 'flex';
        }

        function tutupFoto() {
            document.getElementById('modal').style.display = 'none';
        }

        function toggleMenu() {
            document.getElementById('menu').classList.toggle('show');
        }
    </script>

</body>
</html>
